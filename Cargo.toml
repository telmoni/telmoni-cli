[package]
name = "telmoni-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "The official Telmoni CLI (`telmoni`)."
default-run = "telmoni"

[[bin]]
name = "telmoni"
path = "src/main.rs"

[lib]
name = "telmoni_cli"
path = "src/lib.rs"

[workspace]
resolver = "3"
members = [
    ".",
    "xtask",
    "sdk/rust",
]
default-members = ["."]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
authors = ["Kendrick Lawton"]
repository = "https://github.com/telmoni/telmoni-cli"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"

[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "6"
open = "5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
open = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# The macOS Keychain, where a Mac keeps the saved login (`src/auth/storage.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"

use_self = "warn"
manual_let_else = "warn"
unnested_or_patterns = "warn"
ignored_unit_patterns = "warn"
semicolon_if_nothing_returned = "warn"
elidable_lifetime_names = "warn"
needless_raw_string_hashes = "warn"
map_unwrap_or = "warn"
unused_async = "warn"
useless_let_if_seq = "warn"
unnecessary_wraps = "warn"
match_wildcard_for_single_variants = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
allow_attributes_without_reason = "warn"
allow_attributes = "warn"

[lints]
workspace = true
