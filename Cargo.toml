[package]
name = "telmoni-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "The official Telmoni CLI (`telmoni`)."
default-run = "telmoni"

[[bin]]
name = "telmoni"
path = "src/main.rs"

[lib]
name = "telmoni_cli"
path = "src/lib.rs"

[workspace]
resolver = "2"
members = [
    ".",
    "xtask",
    "sdk/rust",
]
default-members = ["."]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98.0"
license = "Apache-2.0"
authors = ["Kendrick Lawton"]
# The release repository is not decided yet.
repository = "https://github.com/kendricklawton/telmoni"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "6"
open = "5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
open = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[lints]
workspace = true
