# cargo-about: the third-party notices the release archive carries
# (`cargo xtask dist`). The licences are deny.toml's; the target is the one
# the archive is built for.
accepted = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "ISC",
    "BSD-3-Clause",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
targets = ["x86_64-unknown-linux-musl"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
workarounds = ["ring", "rustls"]
