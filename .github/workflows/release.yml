# Releases the CLI from a commit on main that CI has passed. A release is the
# workspace's version bumped in one commit, and nothing else by hand: the crate
# goes to crates.io, and the archive and `install.sh` to a GitHub release, the
# assets `install.sh` downloads from `releases/download/<tag>/` (the latest
# release unless `TELMONI_VERSION` picks one).
#
# One host, x86_64 Linux. The macOS archive waits until it can be hardened and
# signed: the Keychain trusts the binary that saved a login, so an unsigned one
# would ask at every upgrade, and one without the hardened runtime lets another
# library load into the binary it trusts. A Mac builds from source until then,
# and CI's gate still tests on one.
#
# `workflow_run` after CI, guarded so that only a push to this repository counts,
# never a fork's run from a branch it named main. `plan` reads the version and
# asks crates.io and GitHub for it, and only what is still missing runs, so
# every other push ends green with nothing done. The two jobs that release run
# in the `release` environment, whose reviewer is the owner; they start
# together, so one approval sends both. crates.io trusts this file in that
# environment and mints the job a token of its own (trusted publishing), so no
# secret is stored anywhere. The build runs where nothing can publish, restoring
# no cache, and every action is pinned to a commit: a tag moved under this file
# would change what runs where publishing is possible.
name: Release

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  plan:
    name: What the version still needs
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      crates: ${{ steps.plan.outputs.crates }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Read the version, and ask crates.io and GitHub for it
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The token and the provenance name main's tip, `github.sha`, so a
          # commit main has moved past leaves its release to the newer run.
          if [ "$SHA" != "$HEAD" ]; then
            echo "::notice::main has moved on to ${HEAD:0:12}, whose own run releases"
            exit 0
          fi

          python3 - "$RUNNER_TEMP/version" <<'PY'
          import re, sys, tomllib

          def toml(path):
              with open(path, "rb") as f:
                  return tomllib.load(f)

          found = {"Cargo.toml": toml("Cargo.toml")["workspace"]["package"]["version"]}
          for package in toml("Cargo.lock")["package"]:
              if package["name"] in ("telmoni-cli", "xtask") and "source" not in package:
                  found[f"Cargo.lock, {package['name']}"] = package["version"]
          if len(found) != 3:
              sys.exit("::error::Cargo.lock does not hold the workspace's telmoni-cli and xtask")
          if len(set(found.values())) != 1:
              for path, version in found.items():
                  print(f"::error::{path} says {version}")
              sys.exit("::error::the workspace's versions disagree")
          version = found["Cargo.toml"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              sys.exit(f"::error::{version} is not a plain X.Y.Z")
          with open(sys.argv[1], "w", encoding="utf-8") as f:
              f.write(version)
          PY
          version="$(cat "$RUNNER_TEMP/version")"

          # 200 is there and 404 is not; any other answer stops the run rather
          # than guess.
          code="$(curl -sS -o /dev/null -w '%{http_code}' -A "telmoni-cli-release (https://github.com/$GITHUB_REPOSITORY)" "https://crates.io/api/v1/crates/telmoni-cli/$version")"
          case "$code" in
            200) crates=false ;;
            404) crates=true ;;
            *) echo "::error::crates.io answered $code"; exit 1 ;;
          esac

          release=true
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then release=false; fi

          # The commit the tag names, if there is one.
          named=""
          if object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --jq '.object.type + " " + .object.sha' 2>/dev/null)"; then
            named="${object##* }"
            if [ "${object%% *}" = tag ]; then
              named="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$named" --jq .object.sha)"
            fi
          fi

          # On crates.io with no tag here, the version went up by hand or from a
          # run whose release failed: nothing here knows its commit, so it waits
          # for that run's re-run or a new version.
          if [ "$crates" = false ] && [ -z "$named" ] && [ "$release" = true ]; then
            echo "::notice::telmoni-cli $version is on crates.io but not tagged here: re-run the release that published it, or bump the version"
            release=false
          fi

          build=false
          if [ "$crates" = true ] || [ "$release" = true ]; then build=true; fi
          # A tag on another commit while crates.io or the release still lacks
          # the version is that commit's release, half done: finished by
          # re-running its run, never by shipping this commit under its version.
          if [ -n "$named" ] && [ "$named" != "$SHA" ] && [ "$build" = true ]; then
            echo "::error::v$version is tagged at ${named:0:12} but not yet released everywhere: re-run that commit's release, or bump the version"
            exit 1
          fi

          {
            echo "version=$version"
            echo "build=$build"
            echo "crates=$crates"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### The CLI at $version"
            echo
            echo "| Still to do | |"
            echo "|---|---|"
            echo "| crates.io | $crates |"
            echo "| The tag \`v$version\` and its GitHub release | $release |"
          } >> "$GITHUB_STEP_SUMMARY"

  dist:
    name: dist (linux-x86_64)
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Install the toolchain components
        run: rustup component add rustfmt clippy

      - name: Build the release artifacts
        run: cargo xtask dist

      # Compiled as crates.io will compile it, so publishing need not.
      - name: Package and verify the crate
        run: cargo package -p telmoni-cli --locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-x86_64
          path: |
            dist/telmoni-linux-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  crates:
    name: crates.io
    needs: [plan, dist]
    if: needs.plan.outputs.crates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
      url: https://crates.io/crates/telmoni-cli/${{ needs.plan.outputs.version }}
    permissions:
      contents: read
      id-token: write # crates.io's token, minted for this job
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # A re-run after a publish that went through finds the version there.
      - name: Has crates.io the version?
        id: has
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' -A "telmoni-cli-release (https://github.com/$GITHUB_REPOSITORY)" "https://crates.io/api/v1/crates/telmoni-cli/$VERSION")"
          case "$code" in
            200) has=true ;;
            404) has=false ;;
            *) echo "::error::crates.io answered $code"; exit 1 ;;
          esac
          echo "has=$has" >> "$GITHUB_OUTPUT"

      - if: steps.has.outputs.has == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - if: steps.has.outputs.has == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # The build verified it; publishing compiles nothing, so no build script
      # runs beside the token.
      - name: Publish the crate
        if: steps.has.outputs.has == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p telmoni-cli --locked --no-verify

  release:
    name: GitHub release v${{ needs.plan.outputs.version }}
    needs: [plan, dist]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.plan.outputs.version }}
    permissions:
      contents: write # the tag and the release
      # Build provenance, signed for this workflow's identity, so a download is
      # checked against this repository rather than a checksum beside it.
      id-token: write # Sigstore's certificate for the provenance
      attestations: write # the provenance, kept with the repository
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: built
          pattern: dist-*

      - name: Assemble the release directory
        run: |
          set -euo pipefail
          mkdir release
          find built -name "telmoni-*.tar.gz" -exec cp {} release/ \;
          find built -name "SHA256SUMS" -exec cat {} + | sort -u > release/SHA256SUMS
          cp install.sh release/
          (cd release && sha256sum install.sh >> SHA256SUMS)

      - name: Attest the release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/telmoni-*.tar.gz
            release/install.sh

      - name: Tag the commit
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha' 2>/dev/null)"; then
            named="${object##* }"
            if [ "${object%% *}" = tag ]; then
              named="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$named" --jq .object.sha)"
            fi
            if [ "$named" != "$SHA" ]; then
              echo "::error::$tag already names ${named:0:12}"
              exit 1
            fi
            echo "$tag is in place"
          else
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$tag" -f message="telmoni-cli $VERSION" -f object="$SHA" -f type=commit --jq .sha)"
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$object" --silent
            echo "$tag tags ${SHA:0:12}"
          fi

      - name: Publish the release, its notes the commits since the last
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$SHA^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            notes="$(git log --format='- %s' "$previous..$SHA")"
          else
            notes="The first release."
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "v$VERSION" --notes "$notes" \
            release/telmoni-*.tar.gz release/SHA256SUMS release/install.sh
