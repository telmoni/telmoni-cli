# CI: the host-safe gate for the Telmoni CLI.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    name: gate (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: macos-aarch64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the toolchain components
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run the gate
        run: cargo xtask ci

  lint-workflows:
    name: lint workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --status
          tar -xzf "$tarball" actionlint

      - name: actionlint
        run: ./actionlint -color

  ci-status:
    name: CI status
    if: always()
    needs: [gate, lint-workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify every job passed
        env:
          NEEDS: ${{ toJson(needs) }}
        run: jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< "$NEEDS"
