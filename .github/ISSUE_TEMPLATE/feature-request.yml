name: Feature Request
description: Suggest a feature or enhancement for Telmoni CLI & SDKs
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make the Telmoni developer experience better!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false

  - type: dropdown
    id: surface
    attributes:
      label: Which surface does it touch?
      options:
        - CLI (new command or flags)
        - Auth (device-code login / authentication)
        - Config (telmoni config)
        - SDKs (TypeScript, Go, Python, Rust)
        - Docs / Tooling
      multiple: true
    validations:
      required: true
