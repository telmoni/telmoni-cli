name: Bug Report
description: Report an issue with the Telmoni CLI or SDKs
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing an issue! If you have a security vulnerability, please see [SECURITY.md](https://github.com/telmoni/telmoni-cli/blob/main/SECURITY.md) instead of creating a public issue.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Run 'telmoni login'
        2. ...
    validations:
      required: true
  - type: input
    id: cli-version
    attributes:
      label: CLI Version
      description: Run `telmoni --version`
      placeholder: telmoni 0.0.1
    validations:
      required: false
  - type: input
    id: os-arch
    attributes:
      label: Operating System & Architecture
      description: "`uname -srm` (e.g. `Darwin 24.3.0 arm64` or `Linux 6.12.1 x86_64`)."
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - the CLI (telmoni)
        - Auth (telmoni login / logout, device-code login, API keys)
        - Session & organizations (telmoni status / whoami, telmoni org)
        - Config (telmoni config)
        - Rust SDK (sdk/rust)
        - TypeScript SDK (sdk/typescript)
        - Go SDK (sdk/go)
        - Python SDK (sdk/python)
      multiple: true
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Command Output / Logs
      description: Please copy and paste any terminal output or error messages (redact any sensitive credentials).
      render: shell
    validations:
      required: false
