# cargo-deny config: the supply-chain gate (`cargo deny check`, run by CI and `cargo xtask ci`).
# Keep the dependency tree light, license-clean, and advisory-free. See https://embarkstudios.github.io/cargo-deny/

# The two targets this project builds for.
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "ISC",
    "BSD-3-Clause",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
skip = [
    { name = "syn" },
]
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "async-std" },
    { name = "smol" },
    { name = "async-executor" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
